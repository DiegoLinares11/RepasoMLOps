# =============================================================================
# pyproject.toml REAL de la Tarea 4, comentado línea por línea
# Paquete publicado: https://test.pypi.org/project/act3-pipeline-mlops/
# Repo original:     https://github.com/DiegoLinares11/Tarea4-MLOPS
# =============================================================================
# Formato TOML:
#   [seccion]             -> agrupa claves
#   clave = "texto"       -> texto entre comillas
#   clave = ["a", "b"]    -> lista
#   { name = "x" }        -> tabla en línea (como un diccionario de Python)
# Todo lo que empieza con # es comentario (estos no estaban en el original,
# salvo los dos del final).
# =============================================================================


# -----------------------------------------------------------------------------
# [build-system]: CON QUÉ se construye el paquete (PEP 518)
# -----------------------------------------------------------------------------
# Cuando corres "python -m build", build crea un ambiente aislado temporal,
# instala ahí lo que dice "requires" y le pide al "build-backend" que genere
# el sdist (.tar.gz) y el wheel (.whl).
[build-system]
# hatchling es el backend que recomienda el tutorial oficial de la PyPA.
# ">= 1.26" porque desde esa versión entiende license = "MIT" y license-files.
requires = ["hatchling >= 1.26"]
# El objeto de Python que implementa las funciones build_wheel / build_sdist.
# (Las Actividades 1 y 3 usaban "setuptools.build_meta"; ver pyproject-setuptools.toml)
build-backend = "hatchling.build"


# -----------------------------------------------------------------------------
# [project]: los METADATOS del paquete (PEP 621). Es lo que se ve en TestPyPI.
# -----------------------------------------------------------------------------
[project]
# Nombre de DISTRIBUCIÓN: el que se usa en "pip install act3-pipeline-mlops".
# Debe ser ÚNICO en todo el índice (después de normalizar mayúsculas, _ . -).
# Se le agregó "-mlops" porque "act3-pipeline" podía chocar con otro proyecto.
# OJO: NO es el nombre con el que se importa (ese es act3_pipeline).
name = "act3-pipeline-mlops"

# Versión semántica MAYOR.MENOR.PARCHE. Una versión subida NO se puede
# reemplazar: si hay que corregir algo, se sube 0.1.1.
version = "0.1.0"

# Lista de autores: tablas en línea con name y (opcional) email.
authors = [
    { name = "Diego Linares", email = "lin221256@uvg.edu.gt" },
    { name = "Andy Fuentes" },
    { name = "Christian Echeverria" },
    { name = "Diederich Solis" },
]

# Resumen de una línea: aparece debajo del nombre en TestPyPI y en "pip show".
description = "Pipeline de scikit-learn con calibracion de hiperparametros sobre datos de la UEFA Champions League"

# El README se copia entero como descripción larga de la página del proyecto.
readme = "README.md"

# Con qué versiones de Python funciona. pip se niega a instalarlo en 3.9.
# (El código usa sintaxis como "list[str] | None", que necesita 3.10.)
requires-python = ">=3.10"

# Licencia como expresión SPDX (PEP 639). "MIT" = cualquiera puede usar,
# copiar y modificar el código siempre que conserve el aviso de copyright.
license = "MIT"
# El archivo con el texto completo de la licencia; viaja dentro del wheel en
# act3_pipeline_mlops-0.1.0.dist-info/licenses/LICENSE.
license-files = ["LICENSE"]

# Palabras clave para el buscador de PyPI.
keywords = ["scikit-learn", "pipeline", "hyperparameter-tuning", "mlops", "crisp-dm"]

# Clasificadores: etiquetas ESTANDARIZADAS (lista cerrada en
# https://pypi.org/classifiers/). twine check rechaza las mal escritas.
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",          # Python puro: wheel py3-none-any
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencias que pip instalará junto con el paquete.
# Van con RANGOS (>=), NO con ==. Una librería se instala junto a otras que
# también tienen requisitos; si fijara scikit-learn==1.8.0, chocaría con
# cualquier proyecto que necesite 1.7. Las versiones exactas se fijan en la
# APLICACIÓN (como los requirements.txt de los Dockerfiles de la Actividad 4).
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

# Dependencias OPCIONALES ("extras"). No se instalan por defecto; se piden así:
#   pip install "act3-pipeline-mlops[notebook]"
#   pip install "act3-pipeline-mlops[dev]"        (con comillas en PowerShell por los [])
[project.optional-dependencies]
notebook = ["jupyter", "notebook", "matplotlib"]
dev = ["pytest>=7", "build", "twine"]

# Enlaces que aparecen en la barra lateral de la página de TestPyPI.
[project.urls]
Homepage = "https://github.com/DiegoLinares11/Actividad3-MLOPS"
Repository = "https://github.com/DiegoLinares11/Actividad3-MLOPS"

# -----------------------------------------------------------------------------
# [project.scripts]: COMANDOS DE CONSOLA (entry points)
# -----------------------------------------------------------------------------
# comando = "modulo.submodulo:funcion"
# Al instalar, pip crea un ejecutable "act3-demo" (act3-demo.exe en Windows,
# dentro de .venv\Scripts\) que importa act3_pipeline.cli y llama a main().
# Queda registrado en act3_pipeline_mlops-0.1.0.dist-info/entry_points.txt.
[project.scripts]
act3-demo = "act3_pipeline.cli:main"


# -----------------------------------------------------------------------------
# [tool.hatch...]: configuración PROPIA del backend (cada backend tiene la suya)
# -----------------------------------------------------------------------------
# Estos dos comentarios sí venían en el original:
# El nombre de la distribucion (act3-pipeline-mlops) no coincide con el del paquete
# (act3_pipeline), asi que hay que decirle a hatchling donde buscarlo.
[tool.hatch.build.targets.wheel]
# Por defecto hatchling busca src/act3_pipeline_mlops/ (el nombre de la
# distribución con guiones bajos). Como la carpeta se llama act3_pipeline, sin
# esta línea el wheel saldría vacío o fallaría la construcción.
#
# ¿Y el CSV? hatchling incluye TODOS los archivos que están dentro de la
# carpeta del paquete (salvo los ignorados por .gitignore), así que
# src/act3_pipeline/datasets/champions_league_matches.csv entra solo.
# Con setuptools, en cambio, hay que declararlo en [tool.setuptools.package-data].
packages = ["src/act3_pipeline"]
