# =============================================================================
# docker-compose.yml REAL de la Actividad 4, comentado línea por línea
# Repo original: https://github.com/DiegoLinares11/Actividad4-MLOPS
# =============================================================================
# Los comentarios con "##" son explicaciones agregadas para el repaso; los de
# un solo "#" venían en el archivo original.
#
## Este archivo es una COPIA para leer. Para levantarlo de verdad hace falta el
## repo completo (datos/, libreria/*.whl, api/, entrenador/, db/):
##   git clone https://github.com/DiegoLinares11/Actividad4-MLOPS.git
##   cd Actividad4-MLOPS
##   Copy-Item .env.example .env        (bash: cp .env.example .env)
##   docker compose up --build
##
## Formato YAML: la INDENTACIÓN (espacios, nunca tabs) define la jerarquía.
##   clave: valor        -> diccionario
##   - elemento          -> lista
##   [a, b]              -> lista en una línea
## ${VAR:-defecto}: Compose lo reemplaza por la variable VAR del archivo .env
## (o del entorno); si no existe, usa "defecto".
# =============================================================================

# Actividad 4 — MLE/MLOps (UVG)
# Tres microservicios: entrenador (corre y muere), api (queda escuchando) y
# base de datos. Se levantan con un solo comando: docker compose up --build

## Nombre del "proyecto". Compose lo antepone a todo lo que crea: la red queda
## como actividad4-mlops_red-mlops y los volúmenes como actividad4-mlops_modelos
## y actividad4-mlops_pgdata (así aparecen en "docker volume ls").
name: actividad4-mlops

## services: cada entrada es un contenedor (o varios, si se escala).
services:

  # ------------------------------------------------------------------
  # 1) ENTRENADOR — trabajo por lotes: corre una vez y termina.
  #    Deja el modelo en el volumen 'modelos' para que la API lo use.
  # ------------------------------------------------------------------
  entrenador:
    ## build: construir la imagen desde un Dockerfile (en vez de descargarla).
    build:
      ## context: la carpeta que se manda a Docker para construir. Es "." (la
      ## raíz del repo) y no "entrenador/" porque el Dockerfile necesita copiar
      ## también libreria/act3_pipeline-0.1.0-py3-none-any.whl. Un COPY solo
      ## puede ver archivos DENTRO del contexto. El .dockerignore lo recorta.
      context: .
      ## Ruta del Dockerfile, relativa al contexto.
      dockerfile: entrenador/Dockerfile
    ## Nombre:etiqueta que recibe la imagen construida (docker images la muestra así).
    image: act4/entrenador:1.0
    ## Nombre fijo del contenedor (si no, Compose inventa actividad4-mlops-entrenador-1).
    container_name: act4-entrenador
    ## Variables de entorno DENTRO del contenedor. entrenar.py las lee con os.getenv().
    ## Así el mismo código/imagen se configura distinto sin reconstruir.
    environment:
      RUTA_CSV: /datos/champions_league_matches.csv
      DIR_MODELOS: /modelos
      N_ITER: ${N_ITER:-60}                   ## del .env; 60 si no está
      FORZAR_REENTRENO: ${FORZAR_REENTRENO:-0}
    ## volumes: "origen:destino_en_el_contenedor[:opciones]"
    volumes:
      # BIND MOUNT de solo lectura: los datos viven en tu disco, no dentro de
      # la imagen. Cambias el CSV y el proximo entrenamiento lo usa, sin
      # reconstruir nada.
      ## Empieza con ./ -> es una carpeta de TU compu (bind mount).
      ## :ro = read-only: el contenedor no puede modificar ni borrar tus datos.
      - ./datos:/datos:ro
      # VOLUMEN CON NOMBRE: lo administra Docker. Sobrevive a que el
      # contenedor se borre.
      ## No empieza con ./ ni / -> es un nombre: volumen declarado al final del archivo.
      - modelos:/modelos
    ## La red privada a la que se conecta (declarada al final).
    networks: [red-mlops]
    restart: "no"          # es un trabajo por lotes: si termina bien, no revive
    ## (Las comillas en "no" son obligatorias: en YAML, no sin comillas = false.)

  # ------------------------------------------------------------------
  # 2) BASE DE DATOS — guarda el historial de predicciones.
  # ------------------------------------------------------------------
  db:
    ## Este servicio NO tiene build: usa una imagen oficial ya hecha de Docker Hub.
    ## postgres:16-alpine = Postgres 16 sobre Alpine Linux (imagen pequeña).
    image: postgres:16-alpine
    container_name: act4-db
    ## La imagen oficial de Postgres lee estas variables la PRIMERA vez que
    ## arranca para crear la base, el usuario y la contraseña.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predicciones}
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clave_de_ejemplo}
    volumes:
      # Aqui esta el corazon de la persistencia: /var/lib/postgresql/data es
      # donde Postgres escribe TODO. Sin este volumen, cada `docker compose
      # down` borraria la base entera.
      - pgdata:/var/lib/postgresql/data
      # El script de creacion de tablas corre solo la primera vez (cuando el
      # volumen esta vacio).
      ## Bind mount de UN archivo. La imagen de Postgres ejecuta todo lo que haya
      ## en /docker-entrypoint-initdb.d/ al inicializar una base vacía.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ## healthcheck: un comando que Docker corre periódicamente DENTRO del
    ## contenedor. Si devuelve 0, el contenedor está "healthy". "Corriendo" no es
    ## lo mismo que "listo": Postgres tarda unos segundos en aceptar conexiones.
    healthcheck:
      ## pg_isready viene con Postgres y responde 0 cuando acepta conexiones.
      ## Los ${...} los reemplaza Compose ANTES de crear el contenedor, con los
      ## valores del .env. (Si quisieras que los expandiera el shell DENTRO del
      ## contenedor, se escribiría $$VAR.)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-predicciones}"]
      interval: 5s         ## cada cuánto probar
      timeout: 3s          ## cuánto esperar cada prueba
      retries: 10          ## fallos seguidos antes de declararlo "unhealthy"
      start_period: 10s    ## gracia inicial: los fallos aquí no cuentan
    networks: [red-mlops]
    ## Si se cae, Docker lo reinicia, salvo que tú lo hayas detenido a mano.
    restart: unless-stopped
    ## OJO: db NO tiene "ports". Postgres es inalcanzable desde tu compu; solo
    ## los contenedores de red-mlops lo ven (como db:5432).

  # ------------------------------------------------------------------
  # 3) API — sirve el modelo por HTTP. No entrena: solo lee.
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: act4/api:1.0
    container_name: act4-api
    ## ports: "PUERTO_EN_TU_COMPU:PUERTO_DENTRO_DEL_CONTENEDOR".
    ## http://localhost:8000 en tu navegador llega al puerto 8000 del contenedor,
    ## donde escucha uvicorn. Con PUERTO_API=9000 en el .env sería localhost:9000.
    ports:
      - "${PUERTO_API:-8000}:8000"   # unico servicio expuesto al exterior
    environment:
      DIR_MODELOS: /modelos
      ## Cadena de conexión a Postgres: usuario:clave@HOST:puerto/base.
      ## El host es literalmente "db": el NOMBRE DEL SERVICIO. El DNS interno de
      ## Docker lo traduce a la IP del contenedor de Postgres. Nada de IPs fijas.
      URL_BD: postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-clave_de_ejemplo}@db:5432/${POSTGRES_DB:-predicciones}
    volumes:
      # El mismo volumen, pero montado de SOLO LECTURA: la API no tiene por
      # que poder modificar el modelo.
      ## Mínimo privilegio: si alguien explota la API, no puede alterar el modelo.
      - modelos:/modelos:ro
    ## depends_on con CONDICIONES: orden de arranque real, no "esperar 5 segundos".
    depends_on:
      entrenador:
        condition: service_completed_successfully  # espera a que el modelo exista
        ## = el contenedor del entrenador terminó con código de salida 0.
      db:
        condition: service_healthy                 # espera a que Postgres acepte conexiones
        ## = el healthcheck de db respondió bien.
    healthcheck:
      ## La imagen slim no trae curl, así que se usa Python para pedir /salud.
      ## Si urlopen falla, Python sale con código 1 -> unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [red-mlops]
    restart: unless-stopped

# Red privada: los contenedores se ven entre si por su NOMBRE de servicio
# ('db', 'api'). Docker corre un DNS interno. Nada de esto es visible desde
# afuera salvo el puerto que publicamos en 'api'.
networks:
  red-mlops:
    ## bridge = red virtual dentro de tu máquina (el tipo por defecto).
    driver: bridge

# Volumenes con nombre: viven fuera del ciclo de vida de los contenedores.
## "docker compose down" los CONSERVA; "docker compose down -v" los BORRA.
## Se ven con "docker volume ls" e "docker volume inspect actividad4-mlops_modelos".
volumes:
  modelos:
  pgdata:
